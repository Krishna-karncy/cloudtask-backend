name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments from conflicting
concurrency:
  group: production-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🚀 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=== Starting Automated Deployment on EC2 ==="
            cd ~/cloudtask-backend
            
            echo "--> Pulling latest changes from Git..."
            git pull origin main
            
            echo "--> Installing production dependencies..."
            npm install --omit=dev
            
            echo "--> Reloading application with PM2 (Zero Downtime)..."
            pm2 reload cloudtask-api --update-env || pm2 start server.js --name "cloudtask-api"
            
            echo "--> Verifying process status..."
            pm2 status
            
            echo "=== Deployment Completed Successfully! ==="
